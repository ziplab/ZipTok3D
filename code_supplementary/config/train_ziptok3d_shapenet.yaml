_base_: _train_base

trainer:
  max_epochs: 1000
  strategy: ddp_find_unused_parameters_true
  log_every_n_steps: 100
  check_val_every_n_epoch: 1
  precision: 16-mixed
  gradient_clip_val: 0.5
  accumulate_grad_batches: 3

checkpoint:
  save_top_k: 3
  mode: max

data:
  _base_: data/shapenet
  batch_size: 56
  eval_batch_size: 5
  num_workers: 8
  prefetch_factor: 2

model:
  _base_: model/ae_ziptok3d

solver:
  _base_: solver/ae_ziptok3d
