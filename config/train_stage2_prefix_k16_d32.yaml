_base_: _train_base

trainer:
  max_epochs: 100
  strategy: ddp_find_unused_parameters_false
  log_every_n_steps: 20
  check_val_every_n_epoch: 1
  precision: 16-mixed
  gradient_clip_val: 0.5
  accumulate_grad_batches: 1

checkpoint:
  filename: best-{epoch}-{score:.4f}
  save_top_k: 3
  mode: max
  save_weights_only: false

data:
  _base_: data/shapenet
  batch_size: 94
  eval_batch_size: 2

model:
  _base_: model/vae_prefix_k16_d32

solver:
  _base_: solver/vae_prefix_k16_d32
  autoencoder_checkpoint_path: null
